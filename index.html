<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyPulse</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #131517;
      color: white;
      padding: 25px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    header p {
      color: #aaa;
      font-size: 17px;
    }

    .card {
      background: #1d2024;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .card h2 {
      margin-bottom: 15px;
    }

    .input-box {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #ffffff;
      color: #131517;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    #taskList {
      margin-top: 20px;
      list-style: none;
    }

    #taskList li {
      background: #292d32;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .footer {
      text-align: center;
      color: #777;
      margin-top: 30px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>StudyPulse</h1>
      <p>Your simple study companion</p>
    </header>

    <div class="card">
      <h2>Add a Study Task</h2>

      <input
        type="text"
        id="taskInput"
        class="input-box"
        placeholder="Enter your study task..."
      >

      <button onclick="addTask()">Add Task</button>

      <ul id="taskList"></ul>
    </div>

    <div class="card">
      <h2>Study Tips</h2>
      <p>• Study in focused sessions.</p>
      <br>
      <p>• Take short breaks between sessions.</p>
      <br>
      <p>• Keep your phone away while studying.</p>
    </div>

    <div class="footer">
      StudyPulse © 2026
    </div>

  </div>

  <script>
    function addTask() {
      const input = document.getElementById("taskInput");
      const task = input.value.trim();

      if (task === "") {
        alert("Please enter a study task.");
        return;
      }

      const li = document.createElement("li");
      li.textContent = task;

      document.getElementById("taskList").appendChild(li);

      input.value = "";
    }
  </script>

</body>
</html>
