<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyPulse</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f3f5f7;
    color: #222;
    padding: 25px;
}

.container {
    max-width: 1000px;
    margin: auto;
}

header {
    background: #202124;
    color: white;
    padding: 30px;
    border-radius: 18px;
    margin-bottom: 22px;
}

header h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

header p {
    color: #d5d5d5;
}

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.07);
}

.stat {
    text-align: center;
}

.stat p {
    color: #777;
}

.stat h2 {
    margin-top: 8px;
    font-size: 27px;
}

.section {
    background: white;
    padding: 22px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.07);
}

.section h2 {
    margin-bottom: 15px;
}

input,
select,
button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 9px;
    border: 1px solid #ddd;
    font-size: 15px;
}

button {
    background: #202124;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}

.progress {
    height: 14px;
    background: #e1e1e1;
    border-radius: 20px;
    overflow: hidden;
    margin: 12px 0;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #202124;
    transition: 0.4s;
}

.session {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 0;
    border-bottom: 1px solid #eee;
}

.session:last-child {
    border-bottom: none;
}

.session p {
    color: #666;
    margin-top: 5px;
}

.delete {
    width: auto;
    background: #d9534f;
    padding: 8px 13px;
    margin: 0;
}

.clear {
    background: #d9534f;
    margin-top: 15px;
}

.subject-row {
    margin-bottom: 15px;
}

.subject-name {
    display: flex;
    justify-content: space-between;
    margin-bottom: 5px;
}

.small-progress {
    height: 8px;
    background: #ddd;
    border-radius: 10px;
    overflow: hidden;
}

.small-bar {
    height: 100%;
    background: #202124;
}

.goal-box {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.message {
    text-align: center;
    color: #777;
    padding: 15px;
}

@media (max-width: 750px) {
    .cards {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 500px) {
    body {
        padding: 12px;
    }

    .cards {
        grid-template-columns: 1fr;
    }

    .goal-box {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 26px;
    }
